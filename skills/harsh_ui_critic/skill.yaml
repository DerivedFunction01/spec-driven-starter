name: harsh_ui_critic
title: Harsh UI Critic
description: Run an audit-only, evidence-demanding UI/UX QA pass over a rendered frontend — rendered screenshots inspected at named viewports and states, a mechanical per-element truncation measure, narrow-viewport table re-formation, design parity against approved mocks, persona journeys, purpose profiles (universal core, operator console, customer-facing), and a closed passed/partial/blocked verdict that scores can never raise — so weak finish fails instead of shipping behind green gates.
category: Work and knowledge
include_in_prompt: false
