# Tracked config for ops/install-unit.sh — the generic
# installer's per-repo values. The script refuses to run
# without this file beside it; a repo adopting the script
# copies the script and writes its own conf.
TEMPLATE=server.service.tmpl
VALUES_MODULE=backend.apps.ops_values
REQUIRE_KEYS="UNIT PORT"
UNIT_FILE=
PYTHON_MODE=venv
PYTHON_ENV=
HOME_MODE=user
UNIT_DIR_ENV=FIELDKIT_UNIT_DIR
SYSTEMCTL_ENV=FIELDKIT_SYSTEMCTL
CHECK_MODE=exit
STATE_DIR=var/state
